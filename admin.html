<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>African Frame — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<header class="site-header">
  <div class="nav-row">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <span class="logo-bar"></span>
      African <span class="accent">Frame</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="admin-back-link">← Back to site</a>
    </nav>
  </div>
</header>

<main class="admin-main">
  <div class="wrap">
    <h1 class="admin-title">Admin</h1>
    <p class="admin-sub">Edit the News and Reviews shown on the homepage. Changes save automatically to this browser and appear on the site right away.</p>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="news">News</button>
      <button class="admin-tab" data-tab="reviews">Reviews</button>
    </div>

    <!-- NEWS TAB -->
    <section id="tab-news" class="admin-panel">
      <div class="admin-panel-head">
        <h2>News Articles</h2>
        <button class="btn btn-red btn-small" id="addNewsBtn">+ Add Article</button>
      </div>
      <div class="admin-table" id="newsTable"></div>
    </section>

    <!-- REVIEWS TAB -->
    <section id="tab-reviews" class="admin-panel hidden">
      <div class="admin-panel-head">
        <h2>Reviews</h2>
        <button class="btn btn-red btn-small" id="addReviewBtn">+ Add Review</button>
      </div>
      <div class="admin-table" id="reviewsTable"></div>
    </section>

    <div class="admin-reset">
      <button class="admin-reset-btn" id="resetBtn">Reset all content to defaults</button>
    </div>
  </div>
</main>

<!-- ===== Article Form Modal ===== -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Article</h3>
    <form id="articleForm">
      <input type="hidden" id="fieldId" />
      <input type="hidden" id="fieldType" />

      <label>Category / Tag</label>
      <input type="text" id="fieldTag" required placeholder="e.g. Industry, Drama, Casting" />

      <label>Title</label>
      <input type="text" id="fieldTitle" required placeholder="Article headline" />

      <div id="newsOnlyFields">
        <label>Meta (time · read length)</label>
        <input type="text" id="fieldMeta" placeholder="e.g. 2 hrs ago · 4 min read" />
      </div>

      <div id="reviewOnlyFields" class="hidden">
        <label>Blurb</label>
        <textarea id="fieldBlurb" rows="3" placeholder="One-line take on the film"></textarea>

        <label>Score (out of 10)</label>
        <input type="text" id="fieldScore" placeholder="e.g. 8.4" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline-dark" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-red">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
